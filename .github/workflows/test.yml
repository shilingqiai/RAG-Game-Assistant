# Paimon Companion — CI
# Mock 测试：不依赖 API key，每次 push 自动运行

name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "RESUME.md"
      - ".dockerignore"
      - "docker-compose.yml"
      - "Dockerfile"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install llama-index-core>=0.10.57
          pip install llama-index-llms-dashscope>=0.5.0
          pip install llama-index-embeddings-dashscope>=0.5.0
          pip install dashscope>=1.20.0
          pip install gradio>=4.0.0
          pip install httpx>=0.25.0
          pip install rank-bm25>=0.2.0

      - name: Run mock tests (no API key required)
        run: |
          python -m pytest tests/test_pipeline_mock.py tests/test_config.py -v --tb=short
